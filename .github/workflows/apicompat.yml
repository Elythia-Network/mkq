name: apicompat

# 公開 API の差分を直前のタグと比較し、その差分に必要なバージョンを出す。
#
# **mkq は公開ライブラリなので、破壊的変更は事故になる。** PR の時点で
# 「これは minor が要る」「これは patch で出せる」が機械的に分かると、
# リリース時の版判断が勘に頼らなくなる。実際このセッションでは
# `DecodeScheduleTemplateOpts` の戻り値変更 (internal なので patch) と
# `WithRetryDelayOverride` 追加 (minor) の 2 種類が同じ日に出ている。
#
# 落とすのは **壊した**ときだけ。「minor が必要」は情報であって失敗ではない
# ので、結果は summary に出して job は通す。

on:
  # **PR だけで回す。** gorelease は 2 つの版をダウンロードして解析するので
  # 重い。全ブランチの push で回しても、PR より早く分かることは無い。
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apicompat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # gorelease は直前のタグと比較するので履歴とタグが要る。
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compare the public API against the latest tag
        # **toolchain を go.mod に合わせる。** golangci-lint と同じ罠で、
        # `go run pkg@version` は x/exp の `go` directive を基準に toolchain を
        # 選ぶため、そのままだと
        # `package requires newer Go version go1.27 (application built with go1.26)`
        # で解析できない。
        run: |
          base=$(git tag --sort=-v:refname | head -1)
          if [ -z "$base" ]; then
            echo "no tags yet; nothing to compare against" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # **モジュールパスが変わった直後は比べない。** base 側は base の go.mod の
          # パスで解析されるので、mkq の型をシグネチャに含む API (oteladapter など)
          # が「型が変わった」と報告され、API は同じなのに必ず落ちる。パスの変更
          # そのものは major を要しない (#133)。新しいパスでタグを打った後の PR は
          # 普段どおり比べる。
          base_module=$(git show "$base:go.mod" | awk '/^module / {print $2; exit}')
          cur_module=$(awk '/^module / {print $2; exit}' go.mod)
          if [ "$base_module" != "$cur_module" ]; then
            echo "module path changed ($base_module -> $cur_module); skipping comparison against $base" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::module path changed since $base; gorelease comparison skipped"
            exit 0
          fi
          gover=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
          echo "comparing against $base"
          # gorelease は非互換を見つけると 1 を返すので、ここで落とさない。
          out=$(GOTOOLCHAIN="go$gover" go run golang.org/x/exp/cmd/gorelease@latest -base="$base" 2>&1 || true)
          {
            echo "### gorelease vs \`$base\`"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$out"

          # **gorelease の exit code は使わない。** 非互換を見つけたときも、
          # 解析に失敗したときも 1 を返すので区別が付かない。出力で判定する。
          if printf '%s\n' "$out" | grep -q '^## errors'; then
            echo "::error::gorelease could not analyse the module"
            exit 1
          fi

          # **`Version` 定数の値変更は除く。** gorelease は公開定数の値変更を
          # 非互換として報告する (`const x = mkq.Version` のような使い方が
          # 壊れうるため技術的には正しい)。だが version.go を書き換えるのは
          # リリースコミットの仕事そのもので、除かないと**すべてのリリース PR が
          # 落ちる** — このチェックが最も要る場面で。初回のリリース PR (#122) で
          # 実際に踏んだ。
          #
          # 除くのはこの 1 行だけ。他の非互換が並んでいれば残って落ちる。
          incompat=$(printf '%s\n' "$out" \
            | awk '/^## incompatible changes$/{f=1;next} /^#/{f=0} f' \
            | grep -vE '^Version: value changed from ' \
            | grep -v '^$' || true)
          if [ -n "$incompat" ]; then
            echo "::error::public API has incompatible changes; the next release must bump the major version"
            printf '%s\n' "$incompat"
            exit 1
          fi
