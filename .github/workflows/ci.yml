name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt found unformatted files:"
            echo "$diff"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: test
        env:
          MKQ_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test ./... -race -count=1

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # **版を固定する。** 新しいチェックが増えると、コードを触っていない
        # PR が赤くなる。上げるのは明示的な操作にする。
        #
        # **toolchain を go.mod の版に固定する。** `go run pkg@version` は
        # このリポジトリの go.mod を見ず、golangci-lint 自身の `go` directive
        # (1.26.0) を基準に toolchain を選ぶ。そのままだと
        # `the Go language version (go1.26) used to build golangci-lint is
        # lower than the targeted Go version (1.27.1)` で止まる。
        # Go 1.27.2 では、v2.13.2 は標準ライブラリの export data (version 5) を
        # 読めず typecheck で落ちるので、v2.14.0 にした。
        run: |
          gover=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
          GOWORK=off GOTOOLCHAIN="go$gover" \
            go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 \
            run --timeout 10m

      - name: actionlint
        # CodeQL の actions クエリが見るのは script injection などの
        # **セキュリティ**で、式の typo・存在しない needs 参照・runs-on の
        # 誤りといった**正しさ**は見ない。workflow のミスは動かすまで
        # 分からないので静的に落とす。`run:` の中身は shellcheck へ渡る。
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  vulncheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Dependabot と補完的。Dependabot は「依存が古い」を見るが、
        # govulncheck は「その脆弱性に実際に到達するコードパスがあるか」を
        # 見る。到達しないものに追われず、到達するものを見落とさない。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
